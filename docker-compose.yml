# Onlinedurst Heilbronn - Production Docker Compose Setup
# Usage: docker compose up -d

name: 'onlinedurst-production'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlinedurst}
      POSTGRES_USER: ${POSTGRES_USER:-vendure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendure} -d ${POSTGRES_DB:-onlinedurst}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onlinedurst-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onlinedurst-network

  vendure-server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_ENV: production
      VENDURE_SERVER_PORT: 3000
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-onlinedurst}
      DB_USERNAME: ${POSTGRES_USER:-vendure}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECRET: ${COOKIE_SECRET}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://onlinedurst.de,https://www.onlinedurst.de}
      ASSET_URL_PREFIX: ${ASSET_URL_PREFIX:-https://onlinedurst.de/assets/}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://onlinedurst.de}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-"Onlinedurst Heilbronn" <noreply@onlinedurst.de>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - vendure_assets:/usr/src/app/static/assets
    networks:
      - onlinedurst-network

  vendure-worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: ["node", "dist/index-worker.js"]
    environment:
      APP_ENV: production
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-onlinedurst}
      DB_USERNAME: ${POSTGRES_USER:-vendure}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECRET: ${COOKIE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - vendure_assets:/usr/src/app/static/assets
    networks:
      - onlinedurst-network

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VENDURE_SHOP_API_URL: http://vendure-server:3000/shop-api
      VENDURE_CHANNEL_TOKEN: __default_channel__
      VITE_SITE_URL: ${STOREFRONT_URL:-https://onlinedurst.de}
      VITE_SITE_NAME: Onlinedurst Heilbronn - Getränkelieferservice
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
    depends_on:
      - vendure-server
    networks:
      - onlinedurst-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vendure_assets:
    driver: local

networks:
  onlinedurst-network:
    driver: bridge
